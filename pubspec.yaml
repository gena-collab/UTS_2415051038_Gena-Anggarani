
name: cafehunt
description: "CafeHunt - Cafe Discovery and Wishlist App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # REST API
  http: ^1.5.0

  # Supabase Database
  supabase_flutter: ^2.10.3

  # UI and Fonts
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1

  # Map
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Profile Image
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
