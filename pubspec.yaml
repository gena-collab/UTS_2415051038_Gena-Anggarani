
name: cafehunt
description: "CafeHunt - Cafe Discovery and Wishlist App"

# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Application version and build number.
version: 1.0.0+1

# Dart SDK version.
environment:
  sdk: ^3.13.2

# Project dependencies.
dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # REST API
  http: ^1.5.0

  # Supabase Database
  supabase_flutter: ^2.10.3

  # UI and Fonts
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1

  # Map
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

# Development dependencies.
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Flutter configuration.
flutter:
  uses-material-design: true
